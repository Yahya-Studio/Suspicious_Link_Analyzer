<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محلل الروابط المشبوهة</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        h1 {
            color: #1a1a2e;
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.8rem;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #4361ee;
        }
        button {
            padding: 15px 30px;
            background: #4361ee;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
        }
        button:hover { background: #3f37c9; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            display: none;
        }
        .result.safe {
            background: #d4edda;
            border: 2px solid #28a745;
            display: block;
        }
        .result.danger {
            background: #f8d7da;
            border: 2px solid #dc3545;
            display: block;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 15px;
        }
        .stat {
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .stat.malicious { background: #dc3545; color: white; }
        .stat.suspicious { background: #fd7e14; color: white; }
        .stat.harmless { background: #28a745; color: white; }
        .stat.undetected { background: #6c757d; color: white; }
        .stat span { display: block; font-size: 1.5rem; font-weight: bold; }
        .status-icon {
            font-size: 3rem;
            text-align: center;
            margin-bottom: 10px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4361ee;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .url-display {
            word-break: break-all;
            background: rgba(0,0,0,0.1);
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 محلل الروابط المشبوهة</h1>
        <div class="input-group">
            <input type="text" id="urlInput" placeholder="أدخل الرابط للتحقق..." dir="ltr">
            <button id="scanBtn" onclick="scanUrl()">فحص</button>
        </div>
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>جاري الفحص...</p>
        </div>
        <div class="result" id="result"></div>
    </div>

    <script>
        async function scanUrl() {
            const url = document.getElementById('urlInput').value.trim();
            if (!url) return alert('الرجاء إدخال رابط');

            const btn = document.getElementById('scanBtn');
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');

            btn.disabled = true;
            loading.style.display = 'block';
            result.className = 'result';
            result.style.display = 'none';

            try {
                const response = await fetch('/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `url=${encodeURIComponent(url)}`
                });

                const data = await response.json();
                console.log('Response:', data);

                if (!response.ok) {
                    throw new Error(data.detail || 'حدث خطأ');
                }

                const status = data.is_safe ? 'safe' : 'danger';
                const icon = data.is_safe ? '✅' : '⚠️';
                const title = data.is_safe ? 'الرابط آمن' : 'تحذير: رابط مشبوه!';

                loading.style.display = 'none';
                result.className = `result ${status}`;
                result.style.display = 'block';
                result.innerHTML = `
                    <div class="status-icon">${icon}</div>
                    <h3 style="text-align:center">${title}</h3>
                    <div class="url-display">${data.url}</div>
                    <div class="stats">
                        <div class="stat malicious"><span>${data.malicious}</span>خبيث</div>
                        <div class="stat suspicious"><span>${data.suspicious}</span>مشبوه</div>
                        <div class="stat harmless"><span>${data.harmless}</span>آمن</div>
                        <div class="stat undetected"><span>${data.undetected}</span>غير مكتشف</div>
                    </div>
                `;
            } catch (error) {
                console.error('Error:', error);
                alert('خطأ: ' + error.message);
                loading.style.display = 'none';
            } finally {
                btn.disabled = false;
            }
        }

        document.getElementById('urlInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') scanUrl();
        });
    </script>
</body>
</html>
